<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Transfer</title>

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
      <h1 class="text-xl font-bold mb-4 text-center">Send File</h1>

      <!-- Drag & Drop Zone -->
      <div
        id="dropzone"
        class="border-2 border-dashed border-gray-300 p-6 text-center rounded-xl cursor-pointer hover:border-teal-500 transition"
      >
        <p class="text-gray-500">Drag & drop file here or click to select</p>
        <input type="file" id="fileInput" name="file" class="hidden" />
      </div>

      <!-- Upload button -->
      <button
        id="uploadBtn"
        class="mt-4 w-full bg-teal-600 text-white py-2 rounded-lg hover:bg-teal-700 transition"
      >
        Upload
      </button>

      <!-- Progress -->
      <div class="mt-4 hidden" id="progressContainer">
        <div class="w-full bg-gray-200 rounded-full h-3">
          <div id="progressBar" class="bg-teal-600 h-3 rounded-full w-0"></div>
        </div>
        <p class="text-sm text-gray-500 mt-1" id="progressText">0%</p>
      </div>

      <!-- Spinner -->
      <div id="spinner" class="hidden mt-4 text-center">
        <div
          class="animate-spin rounded-full h-8 w-8 border-4 border-teal-500 border-t-transparent mx-auto"
        ></div>
      </div>

      <!-- Result -->
      <div id="result" class="mt-4 text-sm text-gray-700 text-center"></div>
    </div>
  </body>
  <script src="/js/app.js"></script>
</html>
