<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Transfer</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .card {
      width: min(420px, calc(100% - 32px));
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
    }

    h1 {
      margin-top: 0;
    }

    form {
      display: grid;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      background: #0f766e;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
    }

    #result {
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Upload File</h1>
    <form
      action="/upload"
      method="post"
      hx-post="/upload"
      hx-encoding="multipart/form-data"
      hx-target="#result"
      hx-swap="innerHTML"
      enctype="multipart/form-data"
    >
      <input type="file" name="file" required />
      <button type="submit">Upload</button>
    </form>
    <div id="result"></div>
  </main>
</body>
</html>
